<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · 电商售后</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-soft: #eff6ff;
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --user-bubble: #2563eb;
    --ai-bubble: #f1f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }

  .container {
    flex: 1; display: flex; gap: 16px; padding: 16px;
    max-width: 1200px; width: 100%; margin: 0 auto;
    min-height: 0;
  }

  /* 左：聊天 */
  .chat-panel {
    flex: 2; display: flex; flex-direction: column;
    background: var(--panel); border-radius: 12px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .chat-panel .title {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .chat-panel .title .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  #messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 82%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 600;
  }
  .msg.user .avatar { background: #2563eb; }
  .msg.ai .avatar { background: #7c3aed; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); color: var(--text); border-top-left-radius: 4px; }
  .msg.ai .bubble.streaming::after {
    content: "▍"; animation: blink 1s infinite; color: var(--primary);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .chat-input {
    border-top: 1px solid var(--border); padding: 14px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; min-height: 44px; max-height: 120px; outline: none;
  }
  .chat-input textarea:focus { border-color: var(--primary); }
  .chat-input button {
    background: var(--primary); color: #fff; border: none;
    border-radius: 10px; padding: 12px 20px; font-size: 14px;
    cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .chat-input button:hover { background: #1d4ed8; }
  .chat-input button:disabled { background: #93c5fd; cursor: not-allowed; }

  /* 右：提取 */
  .extract-panel {
    flex: 1; display: flex; flex-direction: column;
    background: var(--panel); border-radius: 12px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .extract-panel .title {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 14px;
  }
  .extract-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .extract-body textarea {
    width: 100%; resize: vertical; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
    font-family: inherit; min-height: 120px; outline: none;
  }
  .extract-body textarea:focus { border-color: var(--primary); }
  .extract-body button {
    background: #7c3aed; color: #fff; border: none; border-radius: 10px;
    padding: 11px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .extract-body button:hover { background: #6d28d9; }
  .extract-body button:disabled { background: #c4b5fd; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); }
  #extractResult { display: none; }
  #extractResult.show { display: block; }
  .result-card {
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .result-row {
    display: flex; padding: 10px 12px; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .k { width: 80px; color: var(--muted); flex-shrink: 0; }
  .result-row .v { flex: 1; word-break: break-all; }
  .tag {
    display: inline-block; background: var(--primary-soft); color: var(--primary);
    padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <header>
    <div class="logo">服</div>
    <div>
      <h1>智能客服 · 电商售后</h1>
      <div class="sub">第 1 章 · 纯对话演示</div>
    </div>
  </header>

  <div class="container">
    <!-- 聊天 -->
    <div class="chat-panel">
      <div class="title"><span class="dot"></span>在线咨询</div>
      <div id="messages">
        <div class="msg ai">
          <div class="avatar">AI</div>
          <div class="bubble">您好，我是电商客服助手，有什么可以帮您？</div>
        </div>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" placeholder="输入您的问题，回车发送…" rows="1"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </div>

    <!-- 提取 -->
    <div class="extract-panel">
      <div class="title">售后诉求提取</div>
      <div class="extract-body">
        <div class="hint">粘贴一段售后描述，自动提取订单号、诉求类型、期望方案。</div>
        <textarea id="extractInput" placeholder="例如：订单号 20231015001 的鞋子开胶了，我要退货退款。"></textarea>
        <button id="extractBtn">提取结构化信息</button>
        <div id="extractResult"></div>
      </div>
    </div>
  </div>

<script>
const sessionId = (() => {
  let id = localStorage.getItem('cs_session_id');
  if (!id) { id = 's-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('cs_session_id', id); }
  return id;
})();

const messages = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(avatar);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function setSending(v) {
  sendBtn.disabled = v;
  chatInput.disabled = v;
  sendBtn.textContent = v ? '回复中…' : '发送';
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || sendBtn.disabled) return;
  chatInput.value = '';
  addMsg('user', text);
  setSending(true);

  const bubble = addMsg('ai', '');
  bubble.classList.add('streaming');
  let full = '';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let data;
        try { data = JSON.parse(payload); } catch { continue; }
        if (data.delta) { full += data.delta; bubble.textContent = full; messages.scrollTop = messages.scrollHeight; }
      }
    }
    if (!full) bubble.textContent = '（未收到回复）';
  } catch (e) {
    bubble.textContent = '请求失败：' + e.message;
  } finally {
    bubble.classList.remove('streaming');
    setSending(false);
    chatInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* 提取 */
const extractInput = document.getElementById('extractInput');
const extractBtn = document.getElementById('extractBtn');
const extractResult = document.getElementById('extractResult');

extractBtn.addEventListener('click', async () => {
  const text = extractInput.value.trim();
  if (!text || extractBtn.disabled) return;
  extractBtn.disabled = true;
  extractBtn.textContent = '提取中…';
  extractResult.classList.remove('show');
  extractResult.innerHTML = '';
  try {
    const resp = await fetch('/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    extractResult.innerHTML = `
      <div class="result-card">
        <div class="result-row"><span class="k">订单号</span><span class="v">${data.order_id ?? '—'}</span></div>
        <div class="result-row"><span class="k">诉求类型</span><span class="v"><span class="tag">${data.request_type}</span></span></div>
        <div class="result-row"><span class="k">期望方案</span><span class="v">${data.expected_solution ?? '—'}</span></div>
      </div>`;
    extractResult.classList.add('show');
  } catch (e) {
    extractResult.innerHTML = '<div class="empty">提取失败：' + e.message + '</div>';
    extractResult.classList.add('show');
  } finally {
    extractBtn.disabled = false;
    extractBtn.textContent = '提取结构化信息';
  }
});
</script>
</body>
</html>
